<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHI.V01D AI</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="main-frame">
    <header class="title-box">
      <h1 class="title">
        SHI.V01D <span class="title-ai">AI</span>
      </h1>
    </header>

    <div class="logo-main" aria-hidden="true">
      <img class="snake-logo" src="./assets/43237.svg" alt="" />
    </div>

    <section class="display-box" id="display-box" aria-label="Assistant output">
      <div class="display-content" id="log-container">
        


      </div>
    </section>

    <div class="input-frame" aria-label="Command input">
      <input type="text" class="command" placeholder="cmd_" id="command-input" />
      <span class="icon" id="mic-btn" aria-hidden="true">
        <img class="voice-icon" src="./assets/71afc.svg" alt="" />
      </span>
      <span class="icon" id="send-btn" aria-hidden="true">
        <img class="send-icon" src="./assets/1c0a0.svg" alt="" />
      </span>
    </div>
  </main>
  <script src="script.js" defer></script>

</body>

</html>
